name: NØMIA Quality Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scripts, PWA assets and icons
        run: node scripts/audit.cjs
      - name: Install browser test runner
        run: npm install --no-save playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile browser smoke tests
        run: node scripts/smoke.cjs
