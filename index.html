<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>Travel Photo OS</title>
<style>html,body{margin:0;width:100%;height:100%;background:#080a0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center}.boot div{text-align:center}.boot b{display:block;font-size:18px}.boot span{display:block;margin-top:8px;color:#9ca4af;font-size:12px;max-width:320px;line-height:1.45}</style>
</head>
<body>
<div class="boot"><div><b>Travel Photo OS</b><span id="bootMsg">Chargement de la version complète…</span></div></div>
<script>
(async()=>{
  const VERSION='index-full-20261018v';
  const setBoot=t=>{const e=document.getElementById('bootMsg');if(e)e.textContent=t};

  async function prepareOffline(){
    if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?v='+VERSION,{updateViaCache:'none'});
      try{await reg.update()}catch(e){}
      const ready=await navigator.serviceWorker.ready;
      const worker=ready.active||ready.waiting||ready.installing;
      if(worker)worker.postMessage({type:'WARM_OFFLINE'});
    }catch(e){}
  }

  async function getBase(){
    const url='./app-base.html?v='+VERSION;
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(r&&r.ok)return await r.text();
    }catch(e){}
    if('caches' in window){
      try{
        const r=await caches.match('./app-base.html',{ignoreSearch:true});
        if(r)return await r.text();
      }catch(e){}
    }
    throw new Error('Le moteur de l’app n’est pas disponible hors ligne. Ouvre l’app une fois avec Internet après cette mise à jour.');
  }

  prepareOffline();
  try{
    if(!navigator.onLine)setBoot('Mode hors ligne · ouverture depuis le cache…');
    let html=await getBase();
    html=html.replace('<title>Travel Photo OS — PRO MAX</title>','<title>Travel Photo OS</title>');
    html=html.replace('</head>','<link rel="stylesheet" href="./mobile-ux.css?v='+VERSION+'"><link rel="stylesheet" href="./workspace-windows.css?v='+VERSION+'"><link rel="stylesheet" href="./simple-collab.css?v='+VERSION+'"><link rel="stylesheet" href="./premium-ux.css?v='+VERSION+'"><link rel="stylesheet" href="./day-experience.css?v='+VERSION+'"><link rel="stylesheet" href="./photo-experience.css?v='+VERSION+'"><link rel="stylesheet" href="./voyage-experience.css?v='+VERSION+'"><link rel="stylesheet" href="./booking-launcher.css?v='+VERSION+'"><link rel="stylesheet" href="./booking-native.css?v='+VERSION+'"><link rel="stylesheet" href="./desktop-voyage-fab.css?v='+VERSION+'"><link rel="stylesheet" href="./offline-mode.css?v='+VERSION+'"><link rel="stylesheet" href="./navigation-v2.css?v='+VERSION+'"></head>');
    const menu=`<button class="mobileActionBtn" id="mobileActionBtn" onclick="toggleMobileActions()" aria-label="Ouvrir les actions">☰</button>
<div class="mobileActionMenu" id="mobileActionMenu">
  <div class="mobileActionTitle"><span>Actions</span><button class="btn icon" style="width:34px;min-height:34px" onclick="toggleMobileActions(false)">✕</button></div>
  <div class="mobileActionGrid">
    <button class="mobileAction primary" onclick="mobileDo(openNavigationMode)"><b>🧭 Navigation live</b><span>Suivi GPS et arrivée</span></button>
    <button class="mobileAction" onclick="mobileDo(openGeo)"><b>📍 Live GPS</b><span>Position et partage</span></button>
    <button class="mobileAction" onclick="mobileDo(openCollab)"><b>👥 Collaboratif</b><span>Créer ou rejoindre</span></button>
    <button class="mobileAction" onclick="mobileDo(openUltimate)"><b>◆ Ultimate Hub</b><span>Planning et outils</span></button>
    <button class="mobileAction full" onclick="mobileDo(openAIBuilder)"><b>✦ ChatGPT Trip Builder</b><span>Créer ou modifier un voyage avec l’IA</span></button>
    <div class="mobileActionSep"></div>
    <button class="mobileAction" onclick="mobileDo(locateMe)"><b>◎ Ma position</b><span>Recentrer la carte</span></button>
    <button class="mobileAction" onclick="mobileDo(flyOverview)"><b>⌖ Vue voyage</b><span>Afficher l’ensemble</span></button>
    <button class="mobileAction" onclick="toggleSatellite();refreshMobileToggles()"><b>◐ Satellite</b><span id="mSatState">Carte</span></button>
    <button class="mobileAction" onclick="toggleTerrain();refreshMobileToggles()"><b>⌁ Relief 3D</b><span id="mTerrainState">Activé</span></button>
    <button class="mobileAction" onclick="toggleBuildings();refreshMobileToggles()"><b>▥ Bâtiments</b><span id="mBuildState">Activés</span></button>
    <button class="mobileAction" onclick="mobileDo(tour)"><b>▶ Tour</b><span>Visite automatique</span></button>
    <div class="mobileActionSep"></div>
    <button class="mobileAction" onclick="mobileDo(toggleLeft)"><b>☷ Spots</b><span>Liste et recherche</span></button>
    <button class="mobileAction" onclick="mobileDo(showHome)"><b>⌂ Mes voyages</b><span>Retour à l’accueil</span></button>
  </div>
</div>`;
    html=html.replace('<div class="top">',menu+'\n<div class="top">');
    const cloudInline='<script>window.TRAVEL_PHOTO_CLOUD_CONFIG={url:"https://svfknuvlpxikzqvpksux.supabase.co",anon:"sb_publishable_pm5NiLhMirB8zD0yiYFWXg_6a6R8U1D"};</scr'+'ipt>';
    const scripts=cloudInline+'<script src="./cloud-config.js?v='+VERSION+'"></scr'+'ipt><script src="./mobile-ux.js?v='+VERSION+'"></scr'+'ipt><script src="./workspace-windows.js?v='+VERSION+'"></scr'+'ipt><script src="./simple-collab.js?v='+VERSION+'"></scr'+'ipt><script src="./home-cloud-fix.js?v='+VERSION+'"></scr'+'ipt><script src="./cloud-sync.js?v='+VERSION+'"></scr'+'ipt><script src="./offline-mode.js?v='+VERSION+'"></scr'+'ipt><script src="./premium-ux.js?v='+VERSION+'"></scr'+'ipt><script src="./day-experience.js?v='+VERSION+'"></scr'+'ipt><script src="./photo-experience.js?v='+VERSION+'"></scr'+'ipt><script src="./photo-hook.js?v='+VERSION+'"></scr'+'ipt><script src="./voyage-experience.js?v='+VERSION+'"></scr'+'ipt><script src="./voyage-time-fix.js?v='+VERSION+'"></scr'+'ipt><script src="./booking-launcher.js?v='+VERSION+'"></scr'+'ipt><script src="./booking-native.js?v='+VERSION+'"></scr'+'ipt><script src="./desktop-voyage-fab.js?v='+VERSION+'"></scr'+'ipt><script src="./navigation-v2.js?v='+VERSION+'"></scr'+'ipt>';
    html=html.replace('</body>',scripts+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><b>Travel Photo OS indisponible hors ligne</b><span>'+String(e.message||e)+'</span></div></div>';
  }
})();
</script>
</body>
</html>
