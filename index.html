<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>NØMIA</title>
<style>html,body{margin:0;width:100%;height:100%;background:#080a0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center}.boot div{text-align:center}.boot b{display:block;font-size:18px}.boot span{display:block;margin-top:8px;color:#9ca4af;font-size:12px;max-width:320px;line-height:1.45}</style>
</head>
<body>
<div class="boot"><div><b>NØMIA</b><span id="bootMsg">Chargement de la version complète…</span></div></div>
<script>
(async()=>{
  const VERSION='index-full-20261019-storage-bridge-v6';
  const setBoot=t=>{const e=document.getElementById('bootMsg');if(e)e.textContent=t};

  async function prepareOffline(){
    if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
    try{
      // Keep the app responsive: no full cache warm-up on every page visit.
      // The SW install itself pre-caches offline resources.
      const reg=await navigator.serviceWorker.register('./sw.js?v='+VERSION,{updateViaCache:'none'});
      const key='nomia-sw-check-v1',now=Date.now(),day=24*60*60*1000;
      let last=0;
      try{last=Number(localStorage.getItem(key))||0}catch(e){}
      if(now-last>day){
        try{await reg.update();localStorage.setItem(key,String(now))}catch(e){}
      }
    }catch(e){}
  }

  async function getBase(){
    const url='./app-base.html?v='+VERSION;
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(r&&r.ok)return await r.text();
    }catch(e){}
    if('caches' in window){
      try{
        const r=await caches.match('./app-base.html',{ignoreSearch:true});
        if(r)return await r.text();
      }catch(e){}
    }
    throw new Error('Le moteur de l’app n’est pas disponible hors ligne. Ouvre l’app une fois avec Internet après cette mise à jour.');
  }

  prepareOffline();
  try{
    if(!navigator.onLine)setBoot('Mode hors ligne · ouverture depuis le cache…');
    let html=await getBase();
    html=html.replace(/<title>[^<]*<\/title>/,'<title>NØMIA</title>');
    html=html.replace('href="manifest.webmanifest"','href="manifest.webmanifest?v='+VERSION+'"').replace('href="apple-touch-icon.png"','href="apple-touch-icon.png?v='+VERSION+'"');
    html=html.replace('</head>','<link rel="icon" type="image/png" href="./icon-192.png?v='+VERSION+'"></head>');
    html=html.replace('</head>','<link rel="stylesheet" href="./nomia-dashboard.css?v='+VERSION+'"><link rel="stylesheet" href="./mobile-ux.css?v='+VERSION+'"><link rel="stylesheet" href="./workspace-windows.css?v='+VERSION+'"><link rel="stylesheet" href="./simple-collab.css?v='+VERSION+'"><link rel="stylesheet" href="./premium-ux.css?v='+VERSION+'"><link rel="stylesheet" href="./day-experience.css?v='+VERSION+'"><link rel="stylesheet" href="./photo-experience.css?v='+VERSION+'"><link rel="stylesheet" href="./voyage-experience.css?v='+VERSION+'"><link rel="stylesheet" href="./booking-launcher.css?v='+VERSION+'"><link rel="stylesheet" href="./booking-native.css?v='+VERSION+'"><link rel="stylesheet" href="./desktop-voyage-fab.css?v='+VERSION+'"><link rel="stylesheet" href="./offline-mode.css?v='+VERSION+'"><link rel="stylesheet" href="./navigation-v2.css?v='+VERSION+'"><link rel="stylesheet" href="./celestial-ar.css?v='+VERSION+'"><link rel="stylesheet" href="./photo-pro-suite.css?v='+VERSION+'"><link rel="stylesheet" href="./photo-ar-field.css?v='+VERSION+'"><link rel="stylesheet" href="./sky-atlas.css?v='+VERSION+'"><link rel="stylesheet" href="./nomia-map-premium.css?v='+VERSION+'"><link rel="stylesheet" href="./nomia-map-style.css?v='+VERSION+'"><link rel="stylesheet" href="./nomia-map-mockup.css?v='+VERSION+'"><link rel="stylesheet" href="./nomia-fidelity.css?v='+VERSION+'"><link rel="stylesheet" href="./nomia-photo-fidelity.css?v='+VERSION+'"><link rel="stylesheet" href="./nomia-dual-mockups.css?v='+VERSION+'"><link rel="stylesheet" href="./preview/nomia-simple-nav.css?v='+VERSION+'"><link rel="stylesheet" href="./preview/nomia-windows-plus.css?v='+VERSION+'"><link rel="stylesheet" href="./preview/nomia-window-dock.css?v='+VERSION+'"><link rel="stylesheet" href="./preview/nomia-ui-cleanup.css?v='+VERSION+'"></head>');
    const menu=`<button class="mobileActionBtn" id="mobileActionBtn" onclick="toggleMobileActions()" aria-label="Ouvrir les actions">☰</button>
<div class="mobileActionMenu" id="mobileActionMenu">
  <div class="mobileActionTitle"><span>Actions</span><button class="btn icon" style="width:34px;min-height:34px" onclick="toggleMobileActions(false)">✕</button></div>
  <div class="mobileActionGrid">
    <button class="mobileAction primary" onclick="mobileDo(openNavigationMode)"><b>🧭 Navigation live</b><span>Suivi GPS et arrivée</span></button>
    <button class="mobileAction" onclick="mobileDo(openGeo)"><b>📍 Live GPS</b><span>Position et partage</span></button>
    <button class="mobileAction" onclick="mobileDo(openCollab)"><b>👥 Collaboratif</b><span>Créer ou rejoindre</span></button>
    <button class="mobileAction" onclick="mobileDo(openUltimate)"><b>◆ Ultimate Hub</b><span>Planning et outils</span></button>
    <button class="mobileAction full" onclick="mobileDo(openAIBuilder)"><b>✦ ChatGPT Trip Builder</b><span>Créer ou modifier un voyage avec l’IA</span></button>
    <div class="mobileActionSep"></div>
    <button class="mobileAction" onclick="mobileDo(locateMe)"><b>◎ Ma position</b><span>Recentrer la carte</span></button>
    <button class="mobileAction" onclick="mobileDo(flyOverview)"><b>⌖ Vue voyage</b><span>Afficher l’ensemble</span></button>
    <button class="mobileAction" onclick="toggleSatellite();refreshMobileToggles()"><b>◐ Satellite</b><span id="mSatState">Carte</span></button>
    <button class="mobileAction" onclick="toggleTerrain();refreshMobileToggles()"><b>⌁ Relief 3D</b><span id="mTerrainState">Activé</span></button>
    <button class="mobileAction" onclick="toggleBuildings();refreshMobileToggles()"><b>▥ Bâtiments</b><span id="mBuildState">Activés</span></button>
    <button class="mobileAction" onclick="mobileDo(tour)"><b>▶ Tour</b><span>Visite automatique</span></button>
    <div class="mobileActionSep"></div>
    <button class="mobileAction" onclick="mobileDo(toggleLeft)"><b>☷ Spots</b><span>Liste et recherche</span></button>
    <button class="mobileAction" onclick="mobileDo(showHome)"><b>⌂ Mes voyages</b><span>Retour à l’accueil</span></button>
  </div>
</div>`;
    html=html.replace('<div class="top">',menu+'\n<div class="top">');
    const cloudInline='<script>window.TRAVEL_PHOTO_CLOUD_CONFIG={url:"https://svfknuvlpxikzqvpksux.supabase.co",anon:"sb_publishable_pm5NiLhMirB8zD0yiYFWXg_6a6R8U1D"};</scr'+'ipt>';
    const scripts=cloudInline+'<script src="./cloud-config.js?v='+VERSION+'"></scr'+'ipt><script src="./mobile-ux.js?v='+VERSION+'"></scr'+'ipt><script src="./workspace-windows.js?v='+VERSION+'"></scr'+'ipt><script src="./simple-collab.js?v='+VERSION+'"></scr'+'ipt><script src="./home-cloud-fix.js?v='+VERSION+'"></scr'+'ipt><script src="./cloud-sync.js?v='+VERSION+'"></scr'+'ipt><script src="./offline-mode.js?v='+VERSION+'"></scr'+'ipt><script src="./premium-ux.js?v='+VERSION+'"></scr'+'ipt><script src="./day-experience.js?v='+VERSION+'"></scr'+'ipt><script src="./photo-experience.js?v='+VERSION+'"></scr'+'ipt><script src="./photo-hook.js?v='+VERSION+'"></scr'+'ipt><script src="./voyage-experience.js?v='+VERSION+'"></scr'+'ipt><script src="./voyage-time-fix.js?v='+VERSION+'"></scr'+'ipt><script src="./booking-launcher.js?v='+VERSION+'"></scr'+'ipt><script src="./booking-native.js?v='+VERSION+'"></scr'+'ipt><script src="./desktop-voyage-fab.js?v='+VERSION+'"></scr'+'ipt><script src="./navigation-v2.js?v='+VERSION+'"></scr'+'ipt><script src="./iphone-nav-fix.js?v='+VERSION+'"></scr'+'ipt><script src="./celestial-ar.js?v='+VERSION+'"></scr'+'ipt><script src="./photo-pro-suite.js?v='+VERSION+'"></scr'+'ipt><script src="./photo-ar-field.js?v='+VERSION+'"></scr'+'ipt><script src="./sky-atlas.js?v='+VERSION+'"></scr'+'ipt>';
    html=html.replace('</body>',scripts+'<script src="./nomia-dashboard.js?v='+VERSION+'"></scr'+'ipt><script src="./nomia-map-style.js?v='+VERSION+'"></scr'+'ipt><script src="./nomia-fidelity.js?v='+VERSION+'"></scr'+'ipt><script src="./preview/nomia-simple-nav.js?v='+VERSION+'"></scr'+'ipt><script src="./preview/nomia-windows-plus.js?v='+VERSION+'"></scr'+'ipt><script src="./preview/nomia-window-dock.js?v='+VERSION+'"></scr'+'ipt></body>');
    // Distinct module bundles. Shared app-base.html owns local trip/map/storage data.
    // The legacy standalone root keeps the full set for backwards compatibility.
    const moduleMode=new URLSearchParams(location.search).get('nomia-module');
    const exclude=moduleMode==='photo'
      ? ['voyage-experience.js','voyage-time-fix.js','booking-launcher.js','booking-native.js','desktop-voyage-fab.js']
      : moduleMode==='voyage'
        ? ['photo-experience.js','photo-hook.js','photo-pro-suite.js','photo-ar-field.js','celestial-ar.js','sky-atlas.js']
        : [];
    for(const asset of exclude){
      html=html.split('<scr'+'ipt src="./'+asset+'?v='+VERSION+'"></scr'+'ipt>').join('');
    }
    if(moduleMode==='photo'||moduleMode==='voyage'){
      html=html.replace(/<title>[^<]*<\/title>/,'<title>NØMIA '+(moduleMode==='photo'?'Photo':'Voyage')+' · Moteur</title>');
    }
    if(moduleMode==='photo'||moduleMode==='voyage'){
      const swaps=[
        ['function loadTrips(){try{const r=localStorage.getItem(TRIPS_KEY);if(r)return JSON.parse(r)}catch(e){}return initialTrips()}', 'function loadTrips(){try{return window.NomiaTripStorage.readTrips()||initialTrips()}catch(e){return initialTrips()}}'],
        ['function saveTrips(){localStorage.setItem(TRIPS_KEY,JSON.stringify(trips));renderHome()}', 'function saveTrips(){window.NomiaTripStorage.saveTrips(trips);renderHome()}'],
        ['function loadData(id){try{const r=localStorage.getItem(DATA_PREFIX+id);if(r)return Object.assign(defaults(),JSON.parse(r))}catch(e){}return defaults()}', 'function loadData(id){try{return Object.assign(defaults(),window.NomiaTripStorage.readTrip(id)||{})}catch(e){return defaults()}}'],
        ['function saveData(){if(!store)return;localStorage.setItem(DATA_PREFIX+activeTripId,JSON.stringify(store));refreshStats();renderHome()}', 'function saveData(){if(!store)return;window.NomiaTripStorage.saveTrip(activeTripId,store,{confirmOverwrite:true});refreshStats();renderHome()}']
      ];
      for(const [from,to] of swaps){if(!html.includes(from))throw Error('Moteur de sauvegarde non compatible');html=html.replace(from,to)}
      html=html.replace('<scr'+'ipt>\nconst BUILTIN_JAPAN_SPOTS','<scr'+'ipt src="./hub/trip-storage.js?v='+VERSION+'"></scr'+'ipt><scr'+'ipt>\nconst BUILTIN_JAPAN_SPOTS');
    }
    // Always-visible return to the independent NØMIA ecosystem hub.
    // Inject into the generated document, not the boot document.
    html=html.replace('</body>','<a id="nomiaReturnHub" href="./hub/" aria-label="Retour au portail NØMIA">← <span>NØMIA</span></a><style>#nomiaReturnHub{position:fixed!important;left:14px!important;top:calc(12px + env(safe-area-inset-top,0px))!important;z-index:2147483600!important;display:inline-flex!important;align-items:center;gap:8px!important;padding:10px 14px!important;border:1px solid rgba(215,178,114,.65)!important;border-radius:999px!important;background:rgba(5,19,32,.95)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#efcf91!important;text-decoration:none!important;font:600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif!important;letter-spacing:.08em!important;box-shadow:0 3px 20px #0006!important}#nomiaReturnHub:hover,#nomiaReturnHub:focus-visible{background:#193248!important;outline:2px solid #dcb97c;outline-offset:2px}@media(max-width:560px){#nomiaReturnHub{left:9px!important;top:calc(8px + env(safe-area-inset-top,0px))!important;padding:8px 11px!important;font-size:11px!important}}</style></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><b>NØMIA indisponible hors ligne</b><span>'+String(e.message||e)+'</span></div></div>';
  }
})();
</script>
</body>
</html>
